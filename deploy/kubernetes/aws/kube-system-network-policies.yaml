# NetworkPolicies for strict mode, where a pod that no policy selects is denied all traffic.
# Host-networked pods are exempt. 10.0.0.0/16 stands for the VPC CIDR, and 172.20.0.0/16 for the
# cluster's service CIDR. 169.254.170.23 is the EKS Pod Identity agent on each node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: system-baseline
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 10.0.0.0/16
        - ipBlock:
            cidr: 169.254.169.253/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coredns-ingress
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: load-balancer-controller-webhook
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aws-load-balancer-controller
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 9443
