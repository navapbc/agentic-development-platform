# The objects are JSON, which the AWS provider reads as YAML, so the deploy edits them
# without a YAML parser.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: activity-worker
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      [
        {"objectName": "agentic-platform/database/platform-app", "objectType": "secretsmanager", "objectAlias": "database-platform-app", "jmesPath": [{"path": "username", "objectAlias": "PGUSER"}, {"path": "password", "objectAlias": "PGPASSWORD"}]},
        {"objectName": "agentic-platform/temporal/tls-ca", "objectType": "secretsmanager", "objectAlias": "TEMPORAL_TLS_CA"},
        {"objectName": "agentic-platform/generated/coordination-shared-secret", "objectType": "secretsmanager", "objectAlias": "COORDINATION_SHARED_SECRET"},
        {"objectName": "agentic-platform/generated/litellm-master-key", "objectType": "secretsmanager", "objectAlias": "LITELLM_MASTER_KEY"},
        {"objectName": "agentic-platform/generated/review-attestation-secret", "objectType": "secretsmanager", "objectAlias": "REVIEW_ATTESTATION_SECRET"},
        {"objectName": "agentic-platform/external/authorship-signing-key", "objectType": "secretsmanager", "objectAlias": "AUTHORSHIP_SIGNING_KEY"},
        {"objectName": "agentic-platform/external/github-token", "objectType": "secretsmanager", "objectAlias": "GITHUB_TOKEN"},
        {"objectName": "agentic-platform/external/jira-api-token", "objectType": "secretsmanager", "objectAlias": "JIRA_API_TOKEN"},
        {"objectName": "agentic-platform/external/jira-pat", "objectType": "secretsmanager", "objectAlias": "JIRA_PAT"},
        {"objectName": "agentic-platform/external/slack-webhook-url", "objectType": "secretsmanager", "objectAlias": "SLACK_WEBHOOK_URL"},
        {"objectName": "agentic-platform/external/registry-token", "objectType": "secretsmanager", "objectAlias": "REGISTRY_TOKEN"}
      ]
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: inbound-webhook
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      [
        {"objectName": "agentic-platform/database/platform-app", "objectType": "secretsmanager", "objectAlias": "database-platform-app", "jmesPath": [{"path": "username", "objectAlias": "PGUSER"}, {"path": "password", "objectAlias": "PGPASSWORD"}]},
        {"objectName": "agentic-platform/temporal/tls-ca", "objectType": "secretsmanager", "objectAlias": "TEMPORAL_TLS_CA"},
        {"objectName": "agentic-platform/external/github-webhook-secret", "objectType": "secretsmanager", "objectAlias": "GITHUB_WEBHOOK_SECRET"},
        {"objectName": "agentic-platform/external/jira-webhook-secret", "objectType": "secretsmanager", "objectAlias": "JIRA_WEBHOOK_SECRET"}
      ]
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mcp-gateway
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      [
        {"objectName": "agentic-platform/database/platform-app", "objectType": "secretsmanager", "objectAlias": "database-platform-app", "jmesPath": [{"path": "username", "objectAlias": "PGUSER"}, {"path": "password", "objectAlias": "PGPASSWORD"}]},
        {"objectName": "agentic-platform/generated/mcp-gateway-token", "objectType": "secretsmanager", "objectAlias": "MCP_GATEWAY_TOKEN"}
