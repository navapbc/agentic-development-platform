apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: litellm
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      [
        {"objectName": "agentic-platform/generated/litellm-master-key", "objectType": "secretsmanager", "objectAlias": "LITELLM_MASTER_KEY"},
        {"objectName": "agentic-platform/generated/langfuse-public-key", "objectType": "secretsmanager", "objectAlias": "LANGFUSE_PUBLIC_KEY"},
        {"objectName": "agentic-platform/generated/langfuse-secret-key", "objectType": "secretsmanager", "objectAlias": "LANGFUSE_SECRET_KEY"}
      ]
