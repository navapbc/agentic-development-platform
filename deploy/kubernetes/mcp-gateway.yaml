apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
        app.kubernetes.io/part-of: agentic-dev-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-gateway
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/agentic-dev-platform/mcp-gateway:0.3.0
          command:
            - python
            - -m
            - services.integration.mcp_gateway.server
          ports:
            - name: http
              containerPort: 8150
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentic-platform
                  key: database_url
            - name: ALLOWED_REPOS
              valueFrom:
                configMapKeyRef:
                  name: agentic-platform
                  key: allowed_repos
            - name: REPO_INTELLIGENCE_URL
              valueFrom:
                configMapKeyRef:
                  name: agentic-platform
                  key: repo_intelligence_url
            - name: JIRA_ACCEPTANCE_FIELD
              valueFrom:
                configMapKeyRef:
                  name: agentic-platform
                  key: jira_acceptance_field
          volumeMounts:
            - name: integration-config
              mountPath: /app/config/local
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: integration-config
          configMap:
            name: integration-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  selector:
    app.kubernetes.io/name: mcp-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-gateway
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: agentic-dev-platform
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-gateway
                port:
                  name: http
