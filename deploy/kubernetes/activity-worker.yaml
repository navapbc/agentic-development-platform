apiVersion: v1
kind: ServiceAccount
metadata:
  name: activity-worker
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: activity-worker
    app.kubernetes.io/part-of: agentic-dev-platform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: workspaces
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-worker
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: activity-worker
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: activity-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activity-worker
        app.kubernetes.io/part-of: agentic-dev-platform
    spec:
      serviceAccountName: activity-worker
      # A sidecar init container starts and passes its startup probe before the worker
      # starts, and stops after the worker, so an activity that drains during shutdown
      # still reaches the policy engine.
      initContainers:
        - name: opa
          restartPolicy: Always
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/agentic-dev-platform/opa:0.3.0
          args:
            - run
            - --server
            - --addr=127.0.0.1:8181
            - --log-level=info
            - --ignore=..*
            - /policies
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command: [/usr/local/bin/healthprobe, http://127.0.0.1:8181/health]
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: [/usr/local/bin/healthprobe, http://127.0.0.1:8181/health]
            periodSeconds: 30
            timeoutSeconds: 5
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: activity-worker
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/agentic-dev-platform/platform:0.3.0
          args:
            - python
            - -m
            - services.orchestration.worker
          envFrom:
            - secretRef:
                name: agentic-platform-env
          env:
            - name: WORKER_ROLE
              value: activity
            - name: HEALTH_HEARTBEAT_FILE
              value: /tmp/worker.heartbeat
            - name: EXECUTION_WORKSPACE_ROOT
              value: /workspaces
            - name: REPOSITORY_ROOT
              value: /workspaces/repositories
            - name: GATE_ENGINE_ROOT
              value: /workspaces/engines
            - name: OPA_URL
              value: http://127.0.0.1:8181
            - name: LITELLM_BASE_URL
              value: http://litellm:4000
            - name: SANDBOX_LITELLM_BASE_URL
              value: http://litellm.agentic-dev-platform.svc.cluster.local:4000
            - name: OPENHANDS_IN_CLUSTER
              value: "true"
            - name: GATE_ENGINE_EXECUTION
              value: pod
            - name: REPO_INTELLIGENCE_URL
              valueFrom:
                configMapKeyRef:
                  name: agentic-platform
                  key: repo_intelligence_url
            - name: COORDINATION_URL
              valueFrom:
                configMapKeyRef:
                  name: agentic-platform
                  key: coordination_url
            - name: TEMPORAL_HOST
              valueFrom:
                configMapKeyRef:
                  name: agentic-platform
                  key: temporal_host
            - name: TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: agentic-platform
                  key: temporal_namespace
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
            - name: platform-config
              mountPath: /app/config/local
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/appuser
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command: [python, -m, services.healthcheck, heartbeat, /tmp/worker.heartbeat, --max-age, "60"]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: [python, -m, services.healthcheck, heartbeat, /tmp/worker.heartbeat, --max-age, "60"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: workspaces
        - name: platform-config
          projected:
            sources:
              - configMap:
                  name: platform-config
              - secret:
                  name: platform-config-secrets
        - name: policies
          configMap:
            name: promotion-policies
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
