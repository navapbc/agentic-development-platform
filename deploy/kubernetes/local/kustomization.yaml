apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentic-dev-platform

resources:
  - ../mcp-gateway.yaml
  - ../inbound-webhook.yaml

images:
  - name: REGISTRY/agentic-dev-platform/mcp-gateway
    newName: agentic-dev-platform-local
    newTag: local
  - name: REGISTRY/agentic-dev-platform/inbound-webhook
    newName: agentic-dev-platform-local
    newTag: local

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: agentic-platform
    literals:
      - allowed_repos=agentic-demo-service
      - repo_intelligence_url=http://host.docker.internal:8130
      - jira_acceptance_field=customfield_10040
      - temporal_host=host.docker.internal:7233
      - temporal_namespace=default
  - name: integration-config
    files:
      - github.yaml=../../../config/local/github.yaml
      - jira.yaml=../../../config/local/jira.yaml
      - integrations.yaml=../../../config/local/integrations.yaml

secretGenerator:
  - name: agentic-platform
    type: Opaque
    envs:
      - agentic-platform.secret.env

patches:
  - target:
      kind: Ingress
      name: mcp-gateway
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: mcp-gateway
      $patch: delete
  - target:
      kind: Ingress
      name: inbound-webhook
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: inbound-webhook
      $patch: delete
  - target:
      kind: Deployment
      name: mcp-gateway
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-gateway
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: mcp-gateway
                imagePullPolicy: IfNotPresent
  - target:
      kind: Deployment
      name: inbound-webhook
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inbound-webhook
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: inbound-webhook
                imagePullPolicy: IfNotPresent
  - target:
      kind: Service
      name: inbound-webhook
    patch: |
      - op: add
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 8140
