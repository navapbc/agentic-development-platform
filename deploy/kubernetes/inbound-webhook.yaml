apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbound-webhook
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: inbound-webhook
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inbound-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbound-webhook
        app.kubernetes.io/part-of: agentic-dev-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inbound-webhook
          image: REGISTRY/agentic-dev-platform/inbound-webhook:latest
          command:
            - python
            - -m
            - services.orchestration.webhook.server
          ports:
            - name: http
              containerPort: 8140
          env:
            - name: TEMPORAL_HOST
              valueFrom:
                configMapKeyRef:
                  name: agentic-platform
                  key: temporal_host
            - name: TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: agentic-platform
                  key: temporal_namespace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentic-platform
                  key: database_url
            - name: ALLOWED_REPOS
              valueFrom:
                configMapKeyRef:
                  name: agentic-platform
                  key: allowed_repos
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentic-platform
                  key: github_webhook_secret
          volumeMounts:
            - name: integration-config
              mountPath: /app/config/local
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: integration-config
          configMap:
            name: integration-config
---
apiVersion: v1
kind: Service
metadata:
  name: inbound-webhook
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: inbound-webhook
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  selector:
    app.kubernetes.io/name: inbound-webhook
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inbound-webhook
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: inbound-webhook
    app.kubernetes.io/part-of: agentic-dev-platform
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /webhook/pr
            pathType: Prefix
            backend:
              service:
                name: inbound-webhook
                port:
                  name: http
