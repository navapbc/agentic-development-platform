apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-validate
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: deployment-validate
    app.kubernetes.io/part-of: agentic-dev-platform
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deployment-validate
  namespace: agentic-dev-platform
  labels:
    app.kubernetes.io/name: deployment-validate
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  schedule: "0 14 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: deployment-validate
        app.kubernetes.io/part-of: agentic-dev-platform
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: deployment-validate
            app.kubernetes.io/part-of: agentic-dev-platform
        spec:
          serviceAccountName: deployment-validate
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: deployment-validate
              image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/agentic-dev-platform/platform:0.3.0
              args:
                - python
                - -m
                - scripts.deployment_validate
                - --all-tenants
                - --alert-failures
              envFrom:
                - secretRef:
                    name: agentic-platform-env
              env:
                - name: LITELLM_BASE_URL
                  value: http://litellm:4000
                - name: TEMPORAL_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: agentic-platform
                      key: temporal_host
                - name: TEMPORAL_NAMESPACE
                  valueFrom:
                    configMapKeyRef:
                      name: agentic-platform
                      key: temporal_namespace
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: agentic-platform
                      key: database_url
                - name: SLACK_POSTING_URL
                  value: https://slack-poster:8160
                - name: SLACK_POSTING_TOKEN_FILE
                  value: /var/run/secrets/slack-posting/token
                - name: SLACK_POSTING_CA_FILE
                  value: /etc/slack-poster-ca/ca.pem
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: slack-posting-token
                  mountPath: /var/run/secrets/slack-posting
                  readOnly: true
                - name: slack-poster-ca
                  mountPath: /etc/slack-poster-ca
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: tmp
              emptyDir: {}
            - name: slack-posting-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: slack-posting-service
                      expirationSeconds: 600
                      path: token
            - name: slack-poster-ca
              configMap:
                name: slack-poster-ca
                optional: true
