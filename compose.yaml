name: agentic-dev-platform

x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: [.env]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
      POSTGRES_MULTIPLE_DATABASES: agent_platform,temporal,temporal_visibility,langfuse
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init/00-create-multiple-databases.sh:/docker-entrypoint-initdb.d/00-create-multiple-databases.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d agent_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-change-me-locally}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 15

  temporal-ui:
    image: temporalio/ui:2.53.3@sha256:eef301146e60fad34b47adaecfae4149016e34b2d44ba94fca5fd8e5441f182a
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3001
    ports: ["3001:8080"]
    restart: unless-stopped

  db-migrate:
    <<: *python-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      ALEMBIC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/agent_platform
    depends_on:
      postgres:
        condition: service_healthy

  workflow-worker:
    <<: *python-service
    command: ["python", "-m", "services.orchestration.worker"]
    volumes:
      - ./config/local:/app/config/local:ro
    environment:
      WORKER_ROLE: workflow
      AGENT_BUILD_ID: ${AGENT_BUILD_ID:-dev}
      REPO_INTELLIGENCE_URL: http://repo-intelligence:8120
      COORDINATION_URL: http://coordination-service:8130
      JIRA_ACLI_PATH: /app/vendor/bin/acli
      EXECUTION_WORKSPACE_ROOT: /home/appuser/agent-workspaces
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_started

  activity-worker:
    <<: *python-service
    command: ["python", "-m", "services.orchestration.worker"]
    volumes:
      - ./config/local:/app/config/local:ro
    environment:
      WORKER_ROLE: activity
      AGENT_BUILD_ID: ${AGENT_BUILD_ID:-dev}
      REPO_INTELLIGENCE_URL: http://repo-intelligence:8120
      COORDINATION_URL: http://coordination-service:8130
      JIRA_ACLI_PATH: /app/vendor/bin/acli
      EXECUTION_WORKSPACE_ROOT: /home/appuser/agent-workspaces
      JENKINS_URL: ${JENKINS_URL:-http://jenkins:8080}
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_started

  schedule-bootstrap:
    <<: *python-service
    command: ["sh", "-c", "python -m scripts.reap --schedule && python -m scripts.intake --schedule"]
    restart: "no"
    environment:
      REAP_SCHEDULE_DRY_RUN: "true"
    depends_on:
      temporal:
        condition: service_healthy
      workflow-worker:
        condition: service_started
      activity-worker:
        condition: service_started

  jenkins:
    build:
      context: .
      dockerfile: docker/jenkins.Dockerfile
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PLATFORM_WEBHOOK_BASE_URL: ${PLATFORM_WEBHOOK_BASE_URL:-http://host.docker.internal:8140}
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./docker/jenkins/init.groovy.d:/var/jenkins_home/init.groovy.d:ro
    profiles: ["ci"]
    restart: unless-stopped

  coordination-service:
    <<: *python-service
    command: ["python", "-m", "services.coordination.service"]
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8130:8130"]

  langgraph-service:
    <<: *python-service
    command: ["python", "-m", "services.orchestration.langgraph.service"]
    volumes:
      - ./config/local:/app/config/local:ro
    depends_on:
      litellm:
        condition: service_started
    ports: ["8100:8100"]

  litellm:
    image: ghcr.io/berriai/litellm:v1.97.0@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
    command: ["--config", "/app/config/litellm-config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      AWS_PROFILE: ${AWS_PROFILE}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ./config/local/litellm-config.yaml:/app/config/litellm-config.yaml:ro
      - ${HOME}/.aws:/root/.aws:ro
    ports: ["4000:4000"]
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.19.1@sha256:378b7db7218985444b7bc14f0b0f5b05c864b9481fe470e133654a7fc084072c
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./config/policies:/policies:ro
    ports: ["8181:8181"]
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-locally}
      SALT: ${LANGFUSE_SALT:-change-me-locally}
      TELEMETRY_ENABLED: "false"
    ports: ["3000:3000"]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  repo-intelligence:
    build:
      context: .
      dockerfile: docker/repo-intelligence.Dockerfile
    env_file: [.env]
    profiles: ["repo-intelligence"]
    ports: ["8120:8120"]
    volumes:
      - repo-index-data:/app/repository_indexes
      - ./config/local:/app/config/local:ro
    restart: unless-stopped

  repo-index-worker:
    build:
      context: .
      dockerfile: docker/repo-intelligence.Dockerfile
    command: ["python", "-m", "services.repository_intelligence.indexing.worker"]
    env_file: [.env]
    profiles: ["repo-intelligence"]
    volumes:
      - repo-index-data:/app/repository_indexes
    restart: unless-stopped

  codebase-memory-mcp:
    build:
      context: .
      dockerfile: docker/cbm.Dockerfile
    profiles: ["cbm"]
    restart: unless-stopped

volumes:
  postgres-data:
  repo-index-data:
  jenkins-home:
