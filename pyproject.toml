[project]
name = "agentic-dev-platform"
version = "0.3.0"
description = "Local agentic SDLC platform POC (Jira -> plan -> code -> test -> scan -> PR) with HITL, audit, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "invoke>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<0.31",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<0.29",
    "temporalio>=1.6,<2",
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
reasoning = [
    "langgraph>=1.2,<2",
]
review = [
    "nava-rebar[agents,jira-datacenter]==0.13.1",
    "openpyxl>=3.1,<4",
]
sandbox = [
    "kubernetes>=29,<32",
    "openhands-sdk>=1.56,<2",
    "openhands-tools>=1.56,<2",
]
gateway = [
    "mcp>=1.30,<2",
]
observability = [
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-instrumentation-logging>=0.66b1,<1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]
prompts = [
    "langfuse>=3,<5",
]
storage = [
    "boto3>=1.34,<2",
]
dev = [
    "ruff>=0.5,<0.13",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4,<2",
    "coverage>=7.5,<8",
    "basedpyright>=1.13,<2",
    "jsonschema>=4.20,<5",
    "bandit[toml]>=1.9.4,<2",
    "pip-audit>=2.9,<3",
]
all = [
    "agentic-dev-platform[reasoning,review,sandbox,gateway,observability,prompts,storage]",
    "pydantic-ai-slim[openai,bedrock]>=1.107.7,<2",
]
worker = [
    "agentic-dev-platform[reasoning,sandbox,review,observability,prompts,storage]",
    "pydantic-ai-slim[openai]>=1.107.7,<2",
    "ruff>=0.5,<0.13",
]

[tool.uv]
required-version = ">=0.13.3"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "adapters", "schemas", "database", "scripts", "observability"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "adapters", "schemas", "database", "scripts", "observability", "openhands", "tests"]
extend-exclude = ["services/review/eval/acceptance_cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"database/migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["services", "adapters", "schemas", "database", "scripts", "observability", "openhands", "tests"]
exclude = ["services/review/eval/acceptance_cases"]
extraPaths = [".venv/lib/python3.14/site-packages/rebar/_engine"]

[tool.rebar.verify]
require_plan_review_for_close = true
require_plan_review_for_claim = true
require_completion_verification_for_close = true

# A running gate pins its read-root to an attested git snapshot, which holds no untracked
# files, so this table must stay tracked here rather than in a local rebar.toml. Values
# mirror config/platform/rebar-review.toml, which the review worker and the inv wrappers name
# explicitly. test_rebar_review_config keeps the two in step.
[tool.rebar.llm]
llm_retry_max_attempts = 6
llm_retry_max_wait_s = 60

[tool.rebar.llm.model_classes.standard]
model = "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
provider = "bedrock"

[tool.rebar.llm.model_classes.frontier]
model = "us.anthropic.claude-opus-4-5-20251101-v1:0"
provider = "bedrock"

[tool.rebar.llm.model_classes.trivial]
model = "us.anthropic.claude-haiku-4-5-20251001-v1:0"
provider = "bedrock"
