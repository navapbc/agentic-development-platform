[project]
name = "agentic-dev-platform"
version = "0.1.0"
description = "Local agentic SDLC platform POC (Jira -> plan -> code -> test -> scan -> PR) with HITL, audit, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "invoke>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<0.31",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<0.29",
    "temporalio>=1.6,<2",
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
reasoning = [
    "langgraph>=0.2,<0.4",
    "langchain-openai>=0.1,<0.4",
]
review = [
    "rebar[agents]>=0.1,<1",
]
sandbox = [
    "kubernetes>=29,<32",
    "openhands-sdk>=1.39,<2",
    "openhands-tools>=1.39,<2",
]
gateway = [
    "mcp>=1.8,<2",
]
dev = [
    "ruff>=0.5,<0.13",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<0.25",
    "coverage>=7.5,<8",
    "basedpyright>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "adapters", "schemas", "database", "scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "adapters", "schemas", "database", "scripts", "openhands", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"database/migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["services", "adapters", "schemas", "database", "scripts", "openhands", "tests"]
