name: publish-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture of the platform images.
        type: choice
        options: [arm64, amd64]
        default: arm64

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ (inputs.arch || 'arm64') == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      pushed: ${{ steps.publish.outputs.pushed }}
    env:
      ARCH: ${{ inputs.arch || 'arm64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
      - run: uv sync --locked --all-extras --python 3.12
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_PUBLISH_REGION }}
          role-session-name: publish-images-${{ github.run_id }}
      - name: Publish the platform images
        id: publish
        run: |
          set -euo pipefail
          uv run --no-sync inv publish-platform-images --arch "$ARCH" --manifest images-manifest.json
          echo "pushed=$(jq -c '[.[] | select(.pushed) | {name, repository, digest}]' images-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ env.ARCH }}
          path: |
            infra/terraform/examples/private-bedrock/images.auto.tfvars.json
            images-manifest.json
          if-no-files-found: error

  attest:
    needs: publish
    if: needs.publish.outputs.pushed != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.publish.outputs.pushed) }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_PUBLISH_REGION }}
          role-session-name: attest-images-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image.repository }}
          subject-digest: ${{ matrix.image.digest }}
          push-to-registry: true
          create-storage-record: false
