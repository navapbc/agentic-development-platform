name: publish-images

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture of the platform images.
        type: choice
        options: [arm64, amd64]
        default: arm64

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ (inputs.arch || 'arm64') == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      pushed: ${{ steps.publish.outputs.pushed }}
    env:
      ARCH: ${{ inputs.arch || 'arm64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
      - run: uv sync --locked --all-extras --python 3.12
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_PUBLISH_REGION }}
          role-session-name: publish-images-${{ github.run_id }}
      - name: Publish the platform images
        id: publish
        env:
          IMAGE_SIGNING_PROFILE_ARN: ${{ vars.AWS_IMAGE_SIGNING_PROFILE_ARN }}
          TENANT_CONFIG_BUCKET: ${{ vars.AWS_CONFIG_BUCKET }}
        run: |
          set -euo pipefail
          uv run --no-sync inv publish-platform-images --arch "$ARCH" --manifest images-manifest.json
          echo "pushed=$(jq -c '[.[] | select(.pushed) | {name, repository, digest}]' images-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ env.ARCH }}
          path: |
            infra/terraform/examples/private-bedrock/images.auto.tfvars.json
            images-manifest.json
            cis-evidence/
          if-no-files-found: error

  report:
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: ${{ (inputs.arch || 'arm64') == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write
    env:
      ARCH: ${{ inputs.arch || 'arm64' }}
      TENANT_CONFIG_BUCKET: ${{ vars.AWS_CONFIG_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
      - run: uv sync --locked --all-extras --python 3.12
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_PUBLISH_REGION }}
          role-session-name: image-report-${{ github.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: images-${{ env.ARCH }}
      - name: Check the upstream releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m scripts.upstream_releases check --output image-report/releases.json --targets image-report/release-targets.json
      - name: List the images the exception review scans
        continue-on-error: true
        run: uv run --no-sync python -m scripts.exception_review targets --manifest images-manifest.json --releases image-report/releases.json --output image-report/exception-targets.json
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        continue-on-error: true
      - name: Scan the upstream releases and the excepted images
        continue-on-error: true
        run: |
          set -uo pipefail
          shopt -s nullglob
          mkdir -p image-report/scans
          : > image-report/scans.jsonl
          lists=(image-report/*-targets.json)
          [ "${#lists[@]}" -gt 0 ] || exit 0
          mapfile -t images < <(jq -r -s 'add | map(.image) | unique | .[]' "${lists[@]}")
          for index in "${!images[@]}"; do
            image="${images[$index]}"
            log="image-report/scans/${index}.log"
            pulled=false
            code=-1
            resolved=""
            if docker pull --platform "linux/$ARCH" "$image" > "$log" 2>&1; then
              pulled=true
              digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" | head -n 1 | cut -d @ -f 2)
              [ -z "$digest" ] || resolved="${image%@*}@${digest}"
              uv run --no-sync inv image-scan --image "$image" --arch "$ARCH" >> "$log" 2>&1 < /dev/null
              code=$?
              docker image rm "$image" > /dev/null 2>&1 || true
            fi
            jq -n -c --arg image "$image" --arg log "$log" --arg resolved "$resolved" --argjson pulled "$pulled" --argjson code "$code" '{image: $image, pulled: $pulled, exit_code: $code, resolved: $resolved, log: $log}' >> image-report/scans.jsonl
          done
      - name: Review and prune the finding exceptions
        run: uv run --no-sync python -m scripts.exception_review report --prune --manifest images-manifest.json --releases image-report/releases.json --scans image-report/scans.jsonl --output image-report/exceptions.md --warnings image-report/warnings.md
      - name: Write the run report
        if: ${{ !cancelled() }}
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -uo pipefail
          mkdir -p image-report
          {
            echo "# Image run report for linux/$ARCH"
            echo
            [ ! -s image-report/warnings.md ] || { cat image-report/warnings.md; echo; }
            echo "- Publish job: $PUBLISH_RESULT"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            uv run --no-sync python -m scripts.upstream_releases report --releases image-report/releases.json --scans image-report/scans.jsonl
            echo
            if [ -f image-report/exceptions.md ]; then
              cat image-report/exceptions.md
            else
              echo "> [!WARNING]"
              echo "> The finding exception review did not run."
            fi
          } > image-report/report.md
          cat image-report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: image-report-${{ env.ARCH }}
          path: image-report/
          if-no-files-found: warn

  attest:
    needs: publish
    if: needs.publish.outputs.pushed != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.publish.outputs.pushed) }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_PUBLISH_REGION }}
          role-session-name: attest-images-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image.repository }}
          subject-digest: ${{ matrix.image.digest }}
          push-to-registry: true
          create-storage-record: false
