- tool: semgrep
  rule: python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure
  path: services/orchestration/worker.py
  match: log.warning(
  justification: The rule fires on the word credential in the format string. The arguments are the count of rewritten checkouts, the count of scanned checkouts, and the workspace root path from EXECUTION_WORKSPACE_ROOT. No token value is in scope at the call.
- tool: semgrep
  rule: python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure
  path: services/orchestration/worker.py
  match: log.error(
  justification: The rule fires on the word credential in the format string. The arguments are the count of failed checkouts and a comma-joined list of workspace directory paths. No token value is in scope at the call.
- tool: semgrep
  rule: python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure
  path: services/orchestration/workspace_scrub.py
  match: 'log.error("workspace credential scrub failed for %s: %s", workspace, exc)'
  justification: The rule fires on the word credential in the format string. The arguments are a workspace directory path and an OSError or RuntimeError raised by git config. The RuntimeError carries git stderr, which reports the config file and line number rather than the line content, and the only value the scrub passes on the git command line is the URL it already stripped the userinfo from.
