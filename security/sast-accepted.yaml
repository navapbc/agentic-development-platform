- tool: trivy
  rule: KSV-0048
  path: deploy/kubernetes/sandbox.yaml
  match: '- resources: [pods]'
  justification: The activity worker creates and deletes short-lived pods, which is the function of the Role. They are the OpenHands sandbox pod of each execution, the image verification pod that checks the signature of the sandbox image before the sandbox pod pulls it when image signature verification is on, one pod per external review gate, which builds the gate engine image when the gate names no image, the project checks pod and the project fix pod, which run the checks image or build it from the repository, and the semgrep and trivy scanner pods. Every pod but the sandbox pod runs the buildah builder image. The tenant renderer copies the namespaced Role into each tenant sandbox namespace and binds it only to that tenant's activity-worker ServiceAccount, so it grants nothing outside that namespace, and it covers pods alone, with no Deployment, Job, Secret, or RBAC resource.
- tool: trivy
  rule: KSV-0053
  path: deploy/kubernetes/sandbox.yaml
  match: '- resources: [pods/exec]'
  justification: The activity worker copies the execution checkout and the registry credentials into the pods it creates, runs their scripts, and reads their results back through pods/exec, the tar-over-exec transport the pod runner uses. The tenant renderer copies the Role into each tenant sandbox namespace and binds it only to that tenant's activity-worker ServiceAccount, and the pods it reaches are the short-lived ones that worker created.
- tool: semgrep
  rule: terraform.lang.security.iam.no-iam-creds-exposure.no-iam-creds-exposure
  path: infra/terraform/examples/private-bedrock/eks.tf
  match: Action = "ecr:GetAuthorizationToken"
  justification: The gate, checks, scanner, and image verification pods carry no AWS identity that may pull from ECR, so the tenant's activity worker requests the ECR token their in-pod pulls use and copies it into the pod over the exec stream. The action supports no resource-level scoping. The token authorizes only the pulls the PullTheSandboxImages statement grants, which covers every platform catalog repository in local.image_catalog_repositories, the gate engine repositories in var.eks_gate_image_repository_arns, and every repository under each ECR pull-through cache prefix in local.registry_cache_repository_arns, which exist only in the aws registry mode. The pod deletes the token after the pull and before any project or scanner code runs.
- tool: semgrep
  rule: terraform.aws.security.aws-secretsmanager-secret-unencrypted.aws-secretsmanager-secret-unencrypted
  path: infra/terraform/examples/private-bedrock/registry.tf
  match: resource "aws_secretsmanager_secret" "registry_upstream" {
  justification: ECR reads a pull-through cache credential only from a secret encrypted with the AWS managed aws/secretsmanager key and does not support a customer managed key for it. The secret holds a read-only upstream registry token, and only ECR and the operators who fill it read it.
- tool: semgrep
  rule: terraform.lang.security.iam.no-iam-creds-exposure.no-iam-creds-exposure
  path: infra/terraform/eks-deployer/main.tf
  match: Action = "ecr:GetAuthorizationToken"
  justification: ECS signs in to ECR with the token this action returns to pull the eks-deployer image, and the action supports no resource-level scoping. The token authorizes only the pull the role's other statement grants, which is limited to the eks-deployer repository.
- tool: semgrep
  rule: terraform.lang.security.iam.no-iam-creds-exposure.no-iam-creds-exposure
  path: infra/terraform/github-image-publisher/main.tf
  match: 'Action = "ecr:GetAuthorizationToken" # sast-accepted: image-exception role'
  justification: The image-exception workflow pulls the platform image it records an exception for and scans it, and Docker signs in to ECR with the token this action returns. ECR authorizes GetAuthorizationToken only on the * resource. The token authorizes only the pulls the role's PullThePlatformImages statement grants, which are limited to the platform repositories, and only a workflow of the repository's exception environment running on exception_ref, refs/heads/main by default, can assume the role.
- tool: semgrep
  rule: terraform.lang.security.iam.no-iam-data-exfiltration.no-iam-data-exfiltration
  path: infra/terraform/github-image-publisher/main.tf
  match: 'Action = ["s3:GetObject", "s3:GetObjectVersion", "s3:PutObject"] # sast-accepted: image-exception role'
  justification: The rule reports every S3 read action in a policy that holds any statement on the * resource, and the exception policy holds two, for ecr:GetAuthorizationToken and inspector-scan:ScanSbom, which AWS authorizes only on *. This statement names one object, platform/image_exceptions.yaml in the config bucket, which the workflow reads and rewrites to record the exception.
- tool: semgrep
  rule: terraform.lang.security.iam.no-iam-data-exfiltration.no-iam-data-exfiltration
  path: infra/terraform/github-image-publisher/main.tf
  match: 'Action = ["s3:GetObject", "s3:GetObjectVersion"] # sast-accepted: image-exception role'
  justification: The rule reports every S3 read action in a policy that holds any statement on the * resource, and the exception policy holds two, for ecr:GetAuthorizationToken and inspector-scan:ScanSbom, which AWS authorizes only on *. This statement names one object, platform/image_policy.yaml in the config bucket, which the workflow reads to validate the exception against the image policy.
- tool: trivy
  rule: KSV-0037
  path: deploy/kubernetes/aws/kube-system-network-policies.yaml
  match: 'app.kubernetes.io/part-of: agentic-dev-platform'
  justification: Trivy reports each NetworkPolicy in this file because it sits in kube-system, at the spec, labels, or part-of label line its parser maps the object to, and each of those lines repeats in every object of the file. The file holds only the kube-system policies of strict network policy mode, system-baseline, coredns-ingress, and load-balancer-controller-webhook, and a unit test keeps it that way. They let CoreDNS, the EFS CSI controller, the Load Balancer Controller, and the other kube-system pods run in strict mode, and a NetworkPolicy applies only in its own namespace, so they must live in kube-system. They grant traffic to the system pods and run nothing there.
