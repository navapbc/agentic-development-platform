- tool: bandit
  rule: B108
  path: openhands/runtime/provisioner.py
  match: '{"name": "agent-tmp", "mountPath": "/tmp"},'
  justification: The string is the mount path of an emptyDir volume inside the sandbox pod, which gives the agent a private writable /tmp under a read-only root filesystem. No host temporary file is created.
- tool: bandit
  rule: B404
  path: services/process.py
  match: import subprocess
  justification: services/process.py is the one module that imports subprocess. Every other module starts processes through it, so this import is the single reviewed process-execution boundary.
- tool: bandit
  rule: B603
  path: services/process.py
  match: return subprocess.Popen(argv, executable=executable, shell=False, **checked)
  justification: Bandit reports every subprocess call that does not use a shell. The call takes an argument list, refuses shell and executable overrides, resolves the executable to an absolute path, and takes an explicit timeout. tests/unit/test_process.py covers each of those properties.
- tool: bandit
  rule: B603
  path: services/process.py
  match: return subprocess.run(argv, executable=executable, shell=False, timeout=timeout, **checked)
  justification: Bandit reports every subprocess call that does not use a shell. The call takes an argument list, refuses shell and executable overrides, resolves the executable to an absolute path, and takes an explicit timeout. tests/unit/test_process.py covers each of those properties.
- tool: bandit
  rule: B606
  path: services/process.py
  match: os.execve(resolve_executable(argv[0], path=env.get("PATH")), argv, dict(env))
  justification: replace_process hands an interactive tunnel or demo the current process through os.execve. It takes an argument list, resolves the executable to an absolute path, and passes an explicit environment. No shell is involved.
- tool: semgrep
  rule: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
  path: pyproject.toml
  match: '[tool.uv]'
  justification: A uv exclude-newer cooldown refuses every release younger than its window, so each urgent security release inside the window needs a per-package exemption added with the bump and removed by a later change. Security releases now arrive often enough, from automated vulnerability discovery and zero-day fixes, that a cooldown would turn most development into maintaining those exemptions. The scan covers the risk a cooldown addresses. pip-audit queries OSV, which carries the OpenSSF malicious-package records and fails the scan on any locked release later flagged malicious, and inv sast reports every locked release younger than seven days with its PyPI provenance for the reviewer.
- tool: trivy
  rule: DS-0002
  path: docker/al2023/base.Dockerfile
  match: ''
  justification: The file builds the hardened base and the OpenSCAP scanner, which are build inputs and never run as a service. Every platform Dockerfile starts FROM the base and runs dnf and cis-harden as root in its own steps, so a non-root USER in the base would force each image to switch back to root. Each image that runs as a service sets its own non-root USER in its final stage. The checks image and the buildah builder image set no USER and run as root, which the DS-0002 entries for docker/checks.Dockerfile and docker/buildah.Dockerfile accept. The OpenSCAP stages install packages and scan a mounted root file system, which also needs root.
- tool: trivy
  rule: DS-0002
  path: docker/checks.Dockerfile
  match: ''
  justification: A checks pod runs the repository's checks command in this image through buildah run, against the workspace the pod copies in owned by root. The command installs the project's dependencies into the image toolchain and writes build output and fixes into that workspace, so it runs as root, as it does in a checks image a repository builds itself. The builder pod runs in the tenant's sandbox namespace on the tainted sandbox node pool and carries no service account token.
- tool: trivy
  rule: KSV-0125
  path: openhands/images/agent-server-pod.yaml
  match: '- name: agent-server'
  justification: The agent-server image is the upstream OpenHands release that matches openhands-sdk 1.56.0, pinned by digest. Trivy's default trusted-registry list has no ghcr.io entry. A deployment that mirrors the image into its own registry sets OPENHANDS_AGENT_SERVER_IMAGE to the mirrored digest.
