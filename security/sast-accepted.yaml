- tool: semgrep
  rule: python.lang.security.audit.httpsconnection-detected.httpsconnection-detected
  path: services/healthcheck.py
  match: connection = http.client.HTTPSConnection(LOOPBACK, port, timeout=timeout, context=context)
  justification: The probe passes an explicit context from services.server_tls.probe_context, which verifies the loopback certificate against the certificate the service issued itself and checks the host name. The rule flags any HTTPSConnection because older Python versions did not verify by default, and the images run Python 3.12 or later.
- tool: trivy
  rule: DS-0026
  path: docker/tls-sidecar.Dockerfile
  match: ''
