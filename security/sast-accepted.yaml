- tool: semgrep
  rule: terraform.lang.security.iam.no-iam-resource-exposure.no-iam-resource-exposure
  path: infra/terraform/tenant/images.tf
  match: Action = ["kms:CreateGrant", "kms:RetireGrant", "kms:DescribeKey"]
  justification: ECR assumes the tenant's repository creation role and creates a KMS grant for each repository it creates on push, which AWS documents as required for a creation template that uses KMS. The statement names only the tenant's own key, and only ECR can assume the role.
- tool: semgrep
  rule: terraform.lang.security.iam.no-iam-creds-exposure.no-iam-creds-exposure
  path: infra/terraform/tenant/publisher.tf
  match: Action = "ecr:GetAuthorizationToken"
  justification: Docker signs in to ECR with the token this action returns, so the tenant publisher that pushes the tenant's images needs it, and the action supports no resource-level scoping. The statement sits alone in the publisher_ecr_sign_in policy. The token authorizes only the pushes the role's publisher policy grants, which are limited to the tenant's image prefix, and only the workflows of the tenant's config repository on its allowed refs can assume the role.
- tool: trivy
  rule: DS-0002
  path: docker/buildah.Dockerfile
  match: ''
  justification: The builder runs buildah, which unpacks image layers and runs the gate, checks, and scanner containers, and that needs root inside the pod. The pod spec sets runAsUser 0 explicitly, runs in the tenant's sandbox namespace on the tainted sandbox node pool, carries no service account token, and reaches only DNS, LiteLLM, the registries, and the Pod Identity agent.
