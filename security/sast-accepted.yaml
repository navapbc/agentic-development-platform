- tool: bandit
  rule: B108
  path: openhands/runtime/provisioner.py
  match: '{"name": "agent-tmp", "mountPath": "/tmp"},'
  justification: The string is the mount path of an emptyDir volume inside the sandbox pod, which gives the agent a private writable /tmp under a read-only root filesystem. No host temporary file is created.
- tool: bandit
  rule: B105
  path: scripts/upstream_releases.py
  match: AL2023_TOKEN = "https://public.ecr.aws/token/?scope=repository:amazonlinux/amazonlinux:pull"
  justification: AL2023_TOKEN is the URL of the ECR Public endpoint that issues an anonymous pull token for the amazonlinux repository, which the release check calls before it lists the image tags. Bandit matches the word TOKEN in the name, and the value is a public endpoint URL, not a credential.
- tool: bandit
  rule: B105
  path: services/coordination/auth.py
  match: SHARED_SECRET_ENV_VAR = "COORDINATION_SHARED_SECRET"
  justification: COORDINATION_SHARED_SECRET is the name of the environment variable the coordination service and its workers read the shared secret from. Bandit matches the word SECRET in the assignment, and the value is the variable name the process looks up, not the secret itself.
- tool: bandit
  rule: B106
  path: services/integration/github/credentials.py
  match: identity = _Identity(host="default", owner=owner, token_ref="__token__") if token else None
  justification: __token__ is the key under which the in-memory EnvSecretResolver stores the token passed to build_single_identity_resolver. It is a lookup name, not a credential.
- tool: bandit
  rule: B106
  path: services/integration/jira/credentials.py
  match: token_ref="__token__",
  justification: __token__ is the key under which the in-memory EnvSecretResolver stores the token passed to build_single_project_resolver. It is a lookup name, not a credential.
- tool: bandit
  rule: B105
  path: services/integration/jira/cloud_client.py
  match: token = ""
  justification: token holds the nextPageToken cursor that Jira Cloud returns with each JQL search page, and it starts empty to request the first page. Bandit matches the name token assigned a string literal, and the value is a pagination position, not a credential.
- tool: bandit
  rule: B105
  path: services/orchestration/gates/contract.py
  match: PASS = "pass"
  justification: PASS is the gate outcome constant that every gate and the gate runner compare against. Bandit matches the word pass in the value, which is an outcome name, not a credential.
- tool: bandit
  rule: B105
  path: services/orchestration/temporal_workflows/implementation.py
  match: TOKEN_BUDGET_EXCEEDED = "token_budget_exceeded"
  justification: TOKEN_BUDGET_EXCEEDED is the stop reason recorded when a run exhausts its model token budget. It names a usage limit, not a credential.
- tool: bandit
  rule: B105
  path: services/orchestration/usage_rollup.py
  match: TOKEN_BUDGET_EXCEEDED = "token_budget_exceeded"
  justification: TOKEN_BUDGET_EXCEEDED is the stop reason recorded when a run exhausts its model token budget. It names a usage limit, not a credential.
- tool: bandit
  rule: B404
  path: services/process.py
  match: import subprocess
  justification: services/process.py is the one module that imports subprocess. Every other module starts processes through it, so this import is the single reviewed process-execution boundary.
- tool: bandit
  rule: B603
  path: services/process.py
  match: return subprocess.Popen(argv, executable=executable, shell=False, **checked)
  justification: Bandit reports every subprocess call that does not use a shell. The call takes an argument list, refuses shell and executable overrides, resolves the executable to an absolute path, and takes an explicit timeout. tests/unit/test_process.py covers each of those properties.
- tool: bandit
  rule: B603
  path: services/process.py
  match: return subprocess.run(argv, executable=executable, shell=False, timeout=timeout, **checked)
  justification: Bandit reports every subprocess call that does not use a shell. The call takes an argument list, refuses shell and executable overrides, resolves the executable to an absolute path, and takes an explicit timeout. tests/unit/test_process.py covers each of those properties.
- tool: bandit
  rule: B606
  path: services/process.py
  match: os.execve(resolve_executable(argv[0], path=env.get("PATH")), argv, dict(env))
  justification: replace_process hands an interactive tunnel or demo the current process through os.execve. It takes an argument list, resolves the executable to an absolute path, and passes an explicit environment. No shell is involved.
- tool: bandit
  rule: B105
  path: services/review/types.py
  match: PASS = "pass"
  justification: Verdict.PASS is the review verdict value. The string pass is persisted in review records and signed review verdicts, so it cannot change.
- tool: semgrep
  rule: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
  path: pyproject.toml
  match: '[tool.uv]'
  justification: A uv exclude-newer cooldown blocks a security release until it ages past the window, and a per-package exemption is a fixed cutoff that must be removed by a second change, so a cooldown in the resolver cannot coexist with one-step security fixes. The scan covers the same risk instead. pip-audit queries OSV, which carries the OpenSSF malicious-package records and fails the scan on any locked release later flagged malicious, and inv sast reports every locked release younger than seven days with its PyPI provenance for the reviewer.
- tool: trivy
  rule: DS-0026
  path: docker/Dockerfile
  match: ''
  justification: The platform image runs many roles, including the Temporal workers, the coordination, LangGraph, webhook, and MCP services, the scheduler, and one-shot migrations. Most roles serve no health endpoint, so one image-level HEALTHCHECK cannot be correct for all of them. Health is declared per service where the orchestrator runs it, as the probes in deploy/kubernetes show.
- tool: trivy
  rule: DS-0026
  path: docker/cbm-build.Dockerfile
  match: ''
  justification: The image is a build stage that exports one binary to a scratch layer for docker build --output. It never runs as a container, so it has no health to check.
- tool: trivy
  rule: DS-0026
  path: docker/jumphost-base/Dockerfile
  match: ''
  justification: The jumphost runs as an ECS Fargate task, and ECS ignores a Dockerfile HEALTHCHECK. The task exits on its own TTL, and ECS reports its state from the task lifecycle.
- tool: trivy
  rule: DS-0026
  path: docker/repo-intelligence.Dockerfile
  match: ''
  justification: The repository-intelligence image runs both the HTTP server and the indexing worker, which serves no endpoint, so one image-level HEALTHCHECK cannot be correct for both roles. Health is declared per service where the orchestrator runs it.
- tool: trivy
  rule: DS-0026
  path: docker/temporal-admin-tools.Dockerfile
  match: ''
  justification: The admin-tools image runs one-shot tasks that apply the Temporal schemas or register the namespace and then exit. It serves nothing between start and exit, so it has no health to check, and ECS ignores a Dockerfile HEALTHCHECK.
- tool: trivy
  rule: DS-0002
  path: docker/al2023/base.Dockerfile
  match: ''
  justification: The file builds the hardened base and the OpenSCAP scanner, which are build inputs and never run as a service. Every platform Dockerfile starts FROM the base and runs dnf and cis-harden as root in its own steps, so a non-root USER in the base would force each image to switch back to root. Each image that runs as a service sets its own non-root USER in its final stage. The checks image and the buildah builder image set no USER and run as root, which the DS-0002 entries for docker/checks.Dockerfile and docker/buildah.Dockerfile accept. The OpenSCAP stages install packages and scan a mounted root file system, which also needs root.
- tool: trivy
  rule: DS-0026
  path: docker/al2023/base.Dockerfile
  match: ''
  justification: The base is the FROM image of the platform images and the OpenSCAP scanner runs once in a build step to scan a root file system. Neither runs as a service, so neither has health to check.
- tool: trivy
  rule: DS-0002
  path: docker/checks.Dockerfile
  match: ''
  justification: A checks pod runs the repository's checks command in this image through buildah run, against the workspace the pod copies in owned by root. The command installs the project's dependencies into the image toolchain and writes build output and fixes into that workspace, so it runs as root, as it does in a checks image a repository builds itself. The builder pod runs in the tenant's sandbox namespace on the tainted sandbox node pool and carries no service account token.
- tool: trivy
  rule: DS-0026
  path: docker/checks.Dockerfile
  match: ''
  justification: A checks pod runs one command in this image through buildah run and exits with the command's status, which the worker reports. It serves nothing, so it has no health to check.
- tool: trivy
  rule: DS-0026
  path: docker/clickhouse.Dockerfile
  match: ''
  justification: compose.yaml and the ECS task definition each declare the ClickHouse health check where they run it. ECS probes the HTTPS port with the platform CA the setup container writes when the task starts, and compose probes the HTTP port, so no single build-time HEALTHCHECK fits both, and ECS ignores a Dockerfile HEALTHCHECK.
- tool: trivy
  rule: DS-0026
  path: docker/langfuse.Dockerfile
  match: ''
  justification: The file builds the Langfuse web and worker images, which serve their health endpoints on different ports. compose.yaml and the ECS task definitions declare the check where they run each service, and ECS ignores a Dockerfile HEALTHCHECK.
- tool: trivy
  rule: DS-0026
  path: docker/litellm.Dockerfile
  match: ''
  justification: LiteLLM runs as a Kubernetes Deployment whose readiness and liveness probes call /health/readiness and /health/liveliness. Kubernetes ignores a Dockerfile HEALTHCHECK.
- tool: trivy
  rule: DS-0026
  path: docker/semgrep.Dockerfile
  match: ''
  justification: A scanner pod runs semgrep once in this image through buildah run and returns its JSON output and exit code to the worker. It serves nothing, so it has no health to check.
- tool: trivy
  rule: DS-0026
  path: docker/trivy.Dockerfile
  match: ''
  justification: A scanner pod runs trivy once in this image through buildah run and returns its JSON output and exit code to the worker. It serves nothing, so it has no health to check.
- tool: trivy
  rule: DS-0005
  path: docker/litellm.Dockerfile
  match: ADD --checksum=sha256:${RDS_CA_BUNDLE_SHA256} --chmod=0444 ${RDS_CA_BUNDLE_URL} /etc/ssl/rds-global-bundle.pem
  justification: ADD fetches the RDS CA bundle from its URL, which COPY cannot do, and --checksum fails the build unless the download matches the pinned SHA-256, so the image cannot carry a different bundle than the one reviewed.
