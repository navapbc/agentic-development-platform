# Local developer overrides applied automatically by Compose on top of compose.yaml.
services:
  # Used only by the jumphost and ssh-bastion providers. The direct provider needs no sidecar.
  bedrock-tunnel:
    image: docker.io/alpine/socat:1.8.1.3@sha256:3ed1cd38741bd445ebffa3aecb9d80c46a83db45f5b5ef03332976c7ca9814af
    command: TCP-LISTEN:443,fork,reuseaddr TCP:host.docker.internal:${BEDROCK_TUNNEL_LOCAL_PORT:-8444}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - bedrock-runtime.us-east-1.amazonaws.com
    restart: unless-stopped

  litellm:
    depends_on:
      - bedrock-tunnel

  review-worker:
    depends_on:
      - bedrock-tunnel
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
      - ./database:/app/database
      - ./scripts:/app/scripts
      - ./observability:/app/observability
      - ./.agent-workspaces:/workspaces:ro
    environment:
      LOG_LEVEL: DEBUG
      EXECUTION_WORKSPACE_ROOT: /workspaces

  workflow-worker:
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
      - ./database:/app/database
      - ./scripts:/app/scripts
      - ./observability:/app/observability
    environment:
      LOG_LEVEL: DEBUG

  db-migrate:
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
      - ./database:/app/database
      - ./scripts:/app/scripts
      - ./observability:/app/observability
      - ./alembic.ini:/app/alembic.ini

  activity-worker:
    command: ["sh", "/entrypoint.sh"]
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
      - ./database:/app/database
      - ./scripts:/app/scripts
      - ./observability:/app/observability
      - ./openhands:/app/openhands
      - ./docker/activity-worker-entrypoint.sh:/entrypoint.sh:ro
      - ./.agent-workspaces:/workspaces
      - ${HOME}/.kube/config:/kube/config:ro
      - ../agentic-demo-service:/repos/agentic-demo-service:ro
      - ../agentic-demo-greenfield:/repos/agentic-demo-greenfield:ro
      - ../agentic-demo-ts:/repos/agentic-demo-ts:ro
      - ../agentic-demo-tf:/repos/agentic-demo-tf:ro
      - ../agentic-demo-java:/repos/agentic-demo-java:ro
      - ../agentic-demo-php:/repos/agentic-demo-php:ro
      - ../agentic-demo-ruby:/repos/agentic-demo-ruby:ro
      - ../ai-common-workflows:/engines/ai-common-workflows:ro
      # Local source-control backend. The PFML repo is writable so the local git
      # host can commit branches, and the xlsx export is available for import.
      - ../archive-massgov-pfml:/repos/archive-massgov-pfml
      - ./.agent-context:/app/.agent-context:ro
    environment:
      LOG_LEVEL: DEBUG
      EXECUTION_WORKSPACE_ROOT: /workspaces
      KUBECONFIG: /home/appuser/.kube/config
      OPENHANDS_IN_CLUSTER: "false"
      SANDBOX_LITELLM_BASE_URL: http://host.docker.internal:4000
      GATE_ENGINE_EXECUTION: pod
      GATE_REGISTRY_TLS_VERIFY: "false"
      OPENHANDS_MAX_TOOL_CALLS: "100"
      INTAKE_RUN_REVIEWS: "true"
      INTAKE_RUN_POLICY: "true"
      REPO_INTELLIGENCE_REPOS: "agentic-demo-service=/repos/agentic-demo-service,agentic-demo-greenfield=/repos/agentic-demo-greenfield,agentic-demo-ts=/repos/agentic-demo-ts,agentic-demo-tf=/repos/agentic-demo-tf,agentic-demo-java=/repos/agentic-demo-java,agentic-demo-php=/repos/agentic-demo-php,agentic-demo-ruby=/repos/agentic-demo-ruby,archive-massgov-pfml=/repos/archive-massgov-pfml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "kubernetes.docker.internal:host-gateway"

  langgraph-service:
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
    environment:
      LOG_LEVEL: DEBUG

  repo-intelligence:
    volumes: &repo-intelligence-mounts
      - ../agentic-demo-service:/repos/agentic-demo-service:ro
      - ../agentic-demo-greenfield:/repos/agentic-demo-greenfield:ro
      - ../agentic-demo-ts:/repos/agentic-demo-ts:ro
      - ../agentic-demo-tf:/repos/agentic-demo-tf:ro
      - ../agentic-demo-java:/repos/agentic-demo-java:ro
      - ../agentic-demo-php:/repos/agentic-demo-php:ro
      - ../agentic-demo-ruby:/repos/agentic-demo-ruby:ro
      - ../archive-massgov-pfml:/repos/archive-massgov-pfml:ro
      - ./vendor/bin/codebase-memory-mcp:/usr/local/bin/codebase-memory-mcp:ro
    environment: &repo-intelligence-env
      REPO_INTELLIGENCE_REPOS: "agentic-demo-service=/repos/agentic-demo-service,agentic-demo-greenfield=/repos/agentic-demo-greenfield,agentic-demo-ts=/repos/agentic-demo-ts,agentic-demo-tf=/repos/agentic-demo-tf,agentic-demo-java=/repos/agentic-demo-java,agentic-demo-php=/repos/agentic-demo-php,agentic-demo-ruby=/repos/agentic-demo-ruby,archive-massgov-pfml=/repos/archive-massgov-pfml"
      REPO_INTELLIGENCE_CBM_BINARY: /usr/local/bin/codebase-memory-mcp
      CBM_ALLOWED_ROOT: /repos

  repo-index-worker:
    volumes: *repo-intelligence-mounts
    environment: *repo-intelligence-env

