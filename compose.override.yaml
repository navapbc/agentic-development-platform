# Local developer overrides applied automatically by Compose on top of compose.yaml.
services:
  # Used only by the jumphost and ssh-bastion providers; direct and public need no sidecar.
  bedrock-tunnel:
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:443,fork,reuseaddr TCP:host.docker.internal:${BEDROCK_TUNNEL_LOCAL_PORT:-8443}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - bedrock-runtime.us-east-1.amazonaws.com
    restart: unless-stopped

  litellm:
    depends_on:
      - bedrock-tunnel

  workflow-worker:
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
      - ./database:/app/database
    environment:
      LOG_LEVEL: DEBUG

  activity-worker:
    command: ["sh", "/entrypoint.sh"]
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
      - ./database:/app/database
      - ./openhands:/app/openhands
      - ./docker/activity-worker-entrypoint.sh:/entrypoint.sh:ro
      - ./.agent-workspaces:/workspaces
      - ${HOME}/.kube/config:/kube/config:ro
    environment:
      LOG_LEVEL: DEBUG
      EXECUTION_WORKSPACE_ROOT: /workspaces
      SANDBOX_WORKSPACE_HOST_PATH: ${PWD}/.agent-workspaces
      KUBECONFIG: /home/appuser/.kube/config
      OPENHANDS_IN_CLUSTER: "false"
      SANDBOX_LITELLM_BASE_URL: http://host.docker.internal:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "kubernetes.docker.internal:host-gateway"

  langgraph-service:
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
    environment:
      LOG_LEVEL: DEBUG

  repo-intelligence:
    volumes: &repo-intelligence-mounts
      - ../agentic-demo-service:/repos/agentic-demo-service:ro
      - ../agentic-demo-greenfield:/repos/agentic-demo-greenfield:ro
      - ../agentic-demo-ts:/repos/agentic-demo-ts:ro
      - ../agentic-demo-tf:/repos/agentic-demo-tf:ro
      - ../agentic-demo-java:/repos/agentic-demo-java:ro
      - ../agentic-demo-php:/repos/agentic-demo-php:ro
      - ../agentic-demo-ruby:/repos/agentic-demo-ruby:ro
      - ./vendor/bin/codebase-memory-mcp:/usr/local/bin/codebase-memory-mcp:ro
    environment: &repo-intelligence-env
      REPO_INTELLIGENCE_REPOS: "agentic-demo-service=/repos/agentic-demo-service,agentic-demo-greenfield=/repos/agentic-demo-greenfield,agentic-demo-ts=/repos/agentic-demo-ts,agentic-demo-tf=/repos/agentic-demo-tf,agentic-demo-java=/repos/agentic-demo-java,agentic-demo-php=/repos/agentic-demo-php,agentic-demo-ruby=/repos/agentic-demo-ruby"
      REPO_INTELLIGENCE_CBM_BINARY: /usr/local/bin/codebase-memory-mcp
      CBM_ALLOWED_ROOT: /repos

  repo-index-worker:
    volumes: *repo-intelligence-mounts
    environment: *repo-intelligence-env

