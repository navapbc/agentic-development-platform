# Local developer overrides applied automatically by Compose on top of compose.yaml.
services:
  litellm:
    environment:
      AWS_PROFILE: mpse-private-dev
      AWS_DEFAULT_PROFILE: mpps-private-dev
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:?AWS_SESSION_TOKEN is required}

  review-worker:
    command: ["env", "-u", "AWS_PROFILE", "-u", "AWS_DEFAULT_PROFILE", "python", "-m", "services.orchestration.worker"]
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
      - ./database:/app/database
      - ./scripts:/app/scripts
      - ./observability:/app/observability
      - ./.agent-workspaces:/workspaces:ro
    environment:
      LOG_LEVEL: DEBUG
      EXECUTION_WORKSPACE_ROOT: /workspaces
      AWS_PROFILE: mpse-private-dev
      AWS_DEFAULT_PROFILE: mpse-private-dev
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:?AWS_SESSION_TOKEN is required}

  workflow-worker:
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
      - ./database:/app/database
      - ./scripts:/app/scripts
      - ./observability:/app/observability
    environment:
      LOG_LEVEL: DEBUG

  db-migrate:
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
      - ./database:/app/database
      - ./scripts:/app/scripts
      - ./observability:/app/observability
      - ./alembic.ini:/app/alembic.ini

  activity-worker:
    command: ["sh", "/entrypoint.sh"]
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
      - ./database:/app/database
      - ./scripts:/app/scripts
      - ./observability:/app/observability
      - ./openhands:/app/openhands
      - ./docker/activity-worker-entrypoint.sh:/entrypoint.sh:ro
      - ./.agent-workspaces:/workspaces
      - ${HOME}/.kube/config:/kube/config:ro
      - ../agentic-demo-service:/repos/agentic-demo-service:ro
      - ../agentic-demo-greenfield:/repos/agentic-demo-greenfield:ro
      - ../agentic-demo-ts:/repos/agentic-demo-ts:ro
      - ../agentic-demo-tf:/repos/agentic-demo-tf:ro
      - ../agentic-demo-java:/repos/agentic-demo-java:ro
      - ../agentic-demo-php:/repos/agentic-demo-php:ro
      - ../agentic-demo-ruby:/repos/agentic-demo-ruby:ro
      - ../ai-common-workflows:/engines/ai-common-workflows:ro
      - ./.agent-context:/app/.agent-context:ro
    environment:
      LOG_LEVEL: DEBUG
      EXECUTION_WORKSPACE_ROOT: /workspaces
      KUBECONFIG: /home/appuser/.kube/config
      OPENHANDS_IN_CLUSTER: "false"
      SANDBOX_LITELLM_BASE_URL: http://host.docker.internal:4000
      GATE_ENGINE_EXECUTION: pod
      SCANNER_EXECUTION: pod
      GATE_REGISTRY_TLS_VERIFY: "false"
      OPENHANDS_MAX_TOOL_CALLS: "100"
      INTAKE_RUN_REVIEWS: "true"
      INTAKE_RUN_POLICY: "true"
      REPO_INTELLIGENCE_REPOS: "data-replication-mcs-ingest=/repos/data-replication-mcs-ingest"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "kubernetes.docker.internal:host-gateway"

  langgraph-service:
    volumes:
      - ./services:/app/services
      - ./adapters:/app/adapters
      - ./schemas:/app/schemas
    environment:
      LOG_LEVEL: DEBUG

  repo-intelligence:
    volumes: &repo-intelligence-mounts
      - ./vendor/bin/codebase-memory-mcp:/usr/local/bin/codebase-memory-mcp:ro
      - ../data-replication-mcs-ingest:/repos/data-replication-mcs-ingest:rw
    environment: &repo-intelligence-env
      REPO_INTELLIGENCE_REPOS: "data-replication-mcs-ingest=/repos/data-replication-mcs-ingest"
      REPO_INTELLIGENCE_CBM_BINARY: /usr/local/bin/codebase-memory-mcp
      CBM_ALLOWED_ROOT: /repos

  repo-index-worker:
    volumes: *repo-intelligence-mounts
    environment: *repo-intelligence-env

