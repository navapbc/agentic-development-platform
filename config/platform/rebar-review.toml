# Widened from rebar's default of 4 because these classes have no fallback leg, so a
# throttled Claude call has nowhere else to go.
[llm]
llm_retry_max_attempts = 6
llm_retry_max_wait_s = 60

[llm.model_classes.standard]
model = "us.anthropic.claude-sonnet-5-5"
provider = "bedrock"

[llm.model_classes.frontier]
model = "us.anthropic.claude-opus-5-5"
provider = "bedrock"

[llm.model_classes.trivial]
model = "us.anthropic.claude-haiku-5-5"
provider = "bedrock"
