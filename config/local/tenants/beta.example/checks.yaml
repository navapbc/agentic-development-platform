# Tenant beta's project checks, in the format of config/local/checks.yaml.example. This entry
# replaces the default checks of the node-react profile with a TypeScript type check and the tests.
config_version: 1

checks:
  beta-web:
    image: catalog:checks-node
    command: "npm ci && npx tsc --noEmit && npm test -- --watchAll=false"
    fix_command: "npm ci && npx eslint --fix ."
    working_dir: /workspace
    timeout_minutes: 15
