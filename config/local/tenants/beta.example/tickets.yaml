config_version: 1

# Tenant beta's rebar ticket store, in the format of config/local/tickets.yaml.example. The working
# tree lives in beta's workspace, which no other tenant's worker mounts, and the worker seeds it
# from the beta/tickets/ prefix of the rebar-tickets bucket on first start. The render refuses a
# store outside /tenants/beta or a prefix that overlaps another tenant's.
backend:
  repo_root: /tenants/beta/rebar-tickets
  project: BETA
  default_repo: beta-web
  status_flow:
    work_started: in_progress
    ready_for_review: in_progress
    terminal: closed

poll:
  reader_roles:
    - tickets-reader
  identity_roles:
    agent-platform@users.noreply.invalid: tickets-reader
  allowed_fields:
    - ticket_id
    - title
    - status
    - ticket_type
    - priority
    - description
    - repos
    - tags
    - comments

store:
  bucket: rebar-tickets
  prefix: beta/tickets/
  reader_profile: rebar-tickets-reader
  writer_profile: rebar-tickets-writer

roles:
  read_only: arn:aws:iam::000000000000:role/rebar-tickets-reader
  write: arn:aws:iam::000000000000:role/rebar-tickets-writer

provenance:
  require_actor: true
  require_run_id: true

isolation:
  evidence_bucket: agentic-evidence
  audit_bucket: agentic-audit
  evidence_writer_role: arn:aws:iam::000000000000:role/evidence-writer
  audit_writer_role: arn:aws:iam::000000000000:role/audit-writer
