# Opt-in local tooling, never auto-applied. Include it explicitly and activate its profile:
#   docker compose -f compose.yaml -f compose.override.yaml -f compose.local.yaml --profile registry up -d
#
# The registry is the local stand-in for ECR. It lets the engine gate image be built once and
# pulled by the gate pods in image mode, instead of rebuilding the heavy npm layers on every run.
# It is plain HTTP, so the gate pod pulls with TLS verification disabled via GATE_REGISTRY_TLS_VERIFY=false.
services:
  registry:
    image: registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
    profiles: ["registry"]
    ports: ["5001:5000"]
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

volumes:
  registry-data:
