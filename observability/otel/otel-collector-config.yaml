extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  attributes/redact:
    actions:
      - key: aws.secret_access_key
        action: delete
      - key: aws.access_key_id
        action: delete
      - key: aws.session_token
        action: delete
      - key: authorization
        action: delete
      - key: proxy-authorization
        action: delete
      - key: x-api-key
        action: delete
      - key: api_key
        action: delete
      - key: cookie
        action: delete
      - key: set-cookie
        action: delete
      - key: password
        action: delete
      - key: secret
        action: delete
      - key: jira.api_token
        action: delete
      - key: github.token
        action: delete
      - key: litellm.master_key
        action: delete
      - key: langfuse.public_key
        action: delete
      - key: langfuse.secret_key
        action: delete
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  debug:
    verbosity: normal
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug, otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
