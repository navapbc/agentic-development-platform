apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openhands-sandbox-allow-egress
  namespace: agent-sandbox
spec:
  podSelector:
    matchLabels:
      app: openhands-sandbox
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentic-dev-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
    - to:
        - podSelector:
            matchLabels:
              agentic-dev-platform/mediator: "true"
      ports:
        - protocol: TCP
          port: 8080
