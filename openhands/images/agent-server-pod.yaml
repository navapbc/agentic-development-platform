apiVersion: v1
kind: Pod
metadata:
  name: agent-sandbox
  namespace: agent-sandbox
  labels:
    app: openhands-sandbox
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent-server
      image: ghcr.io/openhands/agent-server:1.56.0-python@sha256:718bf6d719f34184810ecaebe607f1aafaf526e109654815e61ddd6238728023
      workingDir: /home/sandbox
      ports:
        - containerPort: 8000
      env:
        - name: LLM_BASE_URL
          value: http://litellm:4000
        - name: HOME
          value: /home/sandbox
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        capabilities:
          drop:
            - ALL
      readinessProbe:
        exec:
          command:
            - curl
            - -fsS
            - -o
            - /dev/null
            - http://127.0.0.1:8000/health
        initialDelaySeconds: 2
        periodSeconds: 2
        timeoutSeconds: 3
        failureThreshold: 60
      volumeMounts:
        - name: agent-tmp
          mountPath: /tmp
        - name: agent-home
          mountPath: /home/sandbox
  volumes:
    - name: agent-tmp
      emptyDir: {}
    - name: agent-home
      emptyDir: {}
