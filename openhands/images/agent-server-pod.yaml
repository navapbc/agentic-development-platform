apiVersion: v1
kind: Pod
metadata:
  name: agent-sandbox
  namespace: agent-sandbox
  labels:
    app: openhands-sandbox
    app.kubernetes.io/part-of: agentic-dev-platform
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent-server
      image: ghcr.io/openhands/agent-server:latest-python
      ports:
        - containerPort: 8000
      env:
        - name: LLM_BASE_URL
          value: http://litellm:4000
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        capabilities:
          drop:
            - ALL
      readinessProbe:
        exec:
          command:
            - curl
            - -fsS
            - -o
            - /dev/null
            - http://127.0.0.1:8000/health
        initialDelaySeconds: 2
        periodSeconds: 2
        timeoutSeconds: 3
        failureThreshold: 60
